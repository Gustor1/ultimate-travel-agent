[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-travel-agent"
version = "1.9.0"
description = "A generic, privacy-first, multi-agent travel planning system for curated, realistic itineraries."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ultimate Travel Agent Contributors" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.12",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
ultimate-travel-agent = "ultimate_travel_agent.cli:main"

[tool.setuptools]
packages = [
    "ultimate_travel_agent",
    "ultimate_travel_agent.schemas",
    "ultimate_travel_agent.bundle",
    "ultimate_travel_agent.bundle.agents",
    "ultimate_travel_agent.bundle.shared",
    "ultimate_travel_agent.bundle.skills",
    "ultimate_travel_agent.bundle.workflows",
]
package-dir = { "ultimate_travel_agent" = "src/ultimate_travel_agent", "ultimate_travel_agent.bundle" = ".agents" }
include-package-data = true

[tool.setuptools.package-data]
"ultimate_travel_agent" = ["schemas/*.json"]
"ultimate_travel_agent.bundle" = [
    "manifest.json",
    "shared/*.md",
    "shared/*.json",
    "skills/*/SKILL.md",
    "agents/*/agent.md",
    "workflows/*.md",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
