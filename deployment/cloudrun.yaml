apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ultimate-travel-mcp
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/ultimate-travel-mcp:latest
          ports:
            - name: http1
              containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: HOST
              value: "0.0.0.0"
            - name: TRAVEL_DEFAULT_MODE
              value: "offline"
            - name: TRAVEL_MCP_AUTH_REQUIRED
              value: "true"
            - name: TRAVEL_MCP_RATE_LIMIT_ENABLED
              value: "true"
            - name: TRAVEL_MCP_RATE_LIMIT_RPS
              value: "20.0"
            - name: TRAVEL_MCP_RATE_LIMIT_BURST
              value: "50"
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 15
            failureThreshold: 3
