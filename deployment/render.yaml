services:
  - type: web
    name: ultimate-travel-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TRAVEL_DEFAULT_MODE
        value: offline
      - key: TRAVEL_MCP_AUTH_REQUIRED
        value: "true"
      - key: TRAVEL_MCP_API_KEY
        generateValue: true
      - key: TRAVEL_MCP_RATE_LIMIT_ENABLED
        value: "true"
      - key: TRAVEL_MCP_RATE_LIMIT_RPS
        value: "20.0"
      - key: TRAVEL_MCP_RATE_LIMIT_BURST
        value: "50"
