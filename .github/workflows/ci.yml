name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Run test suite
        run: |
          pytest -v

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/ultimate_travel_agent

  distribution:
    name: Build wheel and verify bundled assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
      - name: Smoke-test wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ultimate-travel-agent list-skills
          ultimate-travel-agent install-skills --target smoke-project --include-agents --include-workflows
          test -f smoke-project/.agents/skills/travel-orchestrator/SKILL.md
          test -f smoke-project/.agents/agents/source-verification/agent.md
